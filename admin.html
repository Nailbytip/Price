<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bytip Photos</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ff4fa3" />
  <!-- "Add to Home Screen" on iPhone opens this page full screen, like an app -->
  <link rel="manifest" href="admin.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bytip Photos" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <style>
    :root{
      --bg:#fff7fb; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --pink:#ff4fa3; --pink-deep:#9d2f6b; --red:#dc2626;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      padding-bottom:calc(96px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    header{
      display:flex; align-items:center; gap:10px;
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
      background:#fff; border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:5;
    }
    header img{width:36px; height:36px; border-radius:10px}
    header h1{font-size:16px; margin:0; flex:1}
    header h1 small{display:block; font-weight:500; color:var(--muted); font-size:12px}
    main{max-width:900px; margin:0 auto; padding:16px}
    .btn{
      appearance:none; border:0; border-radius:12px; padding:11px 16px;
      font:inherit; font-weight:800; cursor:pointer;
      background:var(--pink); color:#fff;
    }
    .btn:disabled{opacity:.45; cursor:default}
    .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--line)}
    .btn-small{padding:7px 11px; font-size:13px}
    .hint{color:var(--muted); font-size:13.5px; margin:8px 0 14px}
    .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
    .panel input[type=password]{
      width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
      font:inherit; margin-bottom:10px;
    }
    .install{
      margin:0 0 14px; padding:10px 12px; border-radius:12px;
      background:rgba(255,79,163,.08); border:1px solid rgba(255,79,163,.22);
      color:var(--pink-deep); font-size:13.5px; font-weight:700;
    }
    .add{display:inline-flex; align-items:center; gap:6px}
    .add input{display:none}

    .grid{
      display:grid; gap:12px; margin-top:6px;
      grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    }
    .tile{
      position:relative; background:#fff; border:1px solid var(--line);
      border-radius:14px; overflow:hidden;
    }
    .tile img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover; background:#f3f4f6}
    .tile .num{
      position:absolute; top:6px; left:6px; min-width:26px; height:26px; padding:0 6px;
      border-radius:999px; background:rgba(17,24,39,.75); color:#fff;
      font-size:12.5px; font-weight:800; display:grid; place-items:center;
    }
    .tile .new{
      position:absolute; top:6px; right:6px; padding:3px 8px; border-radius:999px;
      background:var(--pink); color:#fff; font-size:11px; font-weight:800;
    }
    .tile .play{
      position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
      width:40px; height:40px; border-radius:999px; background:rgba(17,24,39,.55);
      color:#fff; display:grid; place-items:center; font-size:16px; pointer-events:none;
    }
    .tools{display:flex; gap:6px; padding:6px}
    .tools button{
      flex:1; appearance:none; border:1px solid var(--line); background:#fff; border-radius:10px;
      padding:8px 0; font:inherit; font-size:16px; font-weight:800; cursor:pointer; color:var(--text);
    }
    .tools button:disabled{opacity:.3; cursor:default}
    .tools .del{color:var(--red)}
    .tile.removed img{opacity:.25; filter:grayscale(1)}
    .tile.removed .num{background:var(--red)}
    .tile.removed .tools button:not(.del){visibility:hidden}

    .bar{
      position:fixed; left:0; right:0; bottom:0; z-index:5;
      display:flex; align-items:center; gap:12px;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:#fff; border-top:1px solid var(--line);
    }
    .status{flex:1; font-size:13.5px; color:var(--muted); margin:0}
    .status.ok{color:#047857; font-weight:700}
    .status.err{color:var(--red); font-weight:700}
    .hidden{display:none !important}
  </style>
</head>
<body>
  <header>
    <img src="assets/logo-144.png" alt="">
    <h1><span data-t="title"></span> <small>Nailgel Bytip</small></h1>
    <button class="btn btn-ghost btn-small" id="lang" type="button"></button>
    <button class="btn btn-ghost btn-small hidden" id="logout" type="button" data-t="logout"></button>
  </header>

  <main>
    <!-- first visit on a phone: paste the GitHub key once, it stays on this phone -->
    <section class="panel hidden" id="login">
      <p class="install hidden" id="installHint" data-t="install"></p>
      <h2 style="margin:0 0 6px; font-size:17px" data-t="connectTitle"></h2>
      <p class="hint" data-t="connectHint"></p>
      <input type="password" id="token" placeholder="github_pat_…" autocomplete="off">
      <button class="btn" id="connect" type="button" data-t="connect"></button>
      <p class="status err" id="loginErr"></p>
    </section>

    <section class="hidden" id="editor">
      <label class="btn add"><span data-t="add"></span>
        <input type="file" id="files" accept="image/*,video/*" multiple>
      </label>
      <p class="hint" data-t="help"></p>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div class="bar hidden" id="bar">
    <span class="status" id="status"></span>
    <button class="btn" id="publish" type="button" disabled data-t="publish"></button>
  </div>

<script>
/* Photo manager for the "Work photos" strip on index.html.
   The site is plain GitHub Pages, so this page edits the repository directly
   through the GitHub API: photos/gallery.json holds the order, photos/ holds
   the photos and videos, photos/thumb/ a .jpg still for each. One Publish = one commit. */
const REPO = "Nailbytip/Price";
const BRANCH = "main";
const LIST_PATH = "photos/gallery.json";
const TOKEN_KEY = "nbt-admin-token";
const LANG_KEY = "nbt-admin-lang";
const FULL_MAX = 1600;     // long side of the photo opened in the lightbox
const THUMB_W = 450;       // width of the strip thumbnail, like the existing ones
const VIDEO_MAX_MB = 50;   // GitHub refuses files over 100 MB; phones choke well before

const TEXT = {
  th: {
    title: "รูปผลงาน", logout: "ออกจากระบบ", switchTo: "EN",
    install: "แนะนำ: เพิ่มแอปนี้ไปที่หน้าจอโฮมก่อน — กดปุ่มแชร์ ⬆︎ แล้วเลือก “เพิ่มไปยังหน้าจอโฮม” จากนั้นเปิดแอปจากหน้าจอโฮมแล้ววางรหัส",
    connectTitle: "เชื่อมต่อ", connect: "เชื่อมต่อ",
    connectHint: "วางรหัส GitHub ครั้งเดียว ระบบจะจำไว้ในโทรศัพท์เครื่องนี้",
    add: "＋ เพิ่มรูป / วิดีโอ",
    help: "รูปใหม่จะอยู่ลำดับแรก · ◀ ▶ เปลี่ยนลำดับ (1 = แรกสุดบนเว็บ) · ✕ ลบ กดอีกครั้งเพื่อเก็บไว้ · เว็บจะเปลี่ยนเมื่อกด “เผยแพร่” เท่านั้น",
    publish: "เผยแพร่", isNew: "ใหม่",
    dirty: "ยังไม่ได้เผยแพร่", preparing: "กำลังเตรียม…",
    uploading: (i, n) => `กำลังอัปโหลด ${i} / ${n}…`, publishing: "กำลังเผยแพร่…",
    done: "เสร็จแล้ว! เว็บจะอัปเดตใน 1–2 นาที",
    keyRefused: "รหัสใช้ไม่ได้ — ออกจากระบบแล้ววางรหัสใหม่", publishFail: "เผยแพร่ไม่สำเร็จ ลองอีกครั้ง",
    badKey: "รหัสนี้ใช้ไม่ได้", noNet: "ไม่มีสัญญาณ ลองอีกครั้ง",
    readFail: "อ่านไฟล์ไม่ได้", tooBig: `วิดีโอใหญ่เกิน (สูงสุด ${VIDEO_MAX_MB} MB) — ตัดให้สั้นลง`,
  },
  en: {
    title: "Work photos", logout: "Log out", switchTo: "ไทย",
    install: "Tip: add this app to your Home Screen first — tap Share ⬆︎ then “Add to Home Screen”. Open it from there and paste the key.",
    connectTitle: "Connect", connect: "Connect",
    connectHint: "Paste the GitHub key once. It stays saved on this phone.",
    add: "＋ Add photos / videos",
    help: "New items go first · ◀ ▶ change the order (1 = first on the site) · ✕ removes, tap again to keep · Nothing changes on the site until you press “Publish”.",
    publish: "Publish", isNew: "NEW",
    dirty: "Not published yet", preparing: "Preparing…",
    uploading: (i, n) => `Uploading ${i} / ${n}…`, publishing: "Publishing…",
    done: "Done! On the site in 1–2 min",
    keyRefused: "Key refused — log out and paste a new key", publishFail: "Could not publish, try again",
    badKey: "This key does not work", noNet: "No connection, try again",
    readFail: "A file could not be read", tooBig: `Video too big (max ${VIDEO_MAX_MB} MB) — shorten it`,
  },
};

const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { /* kept for this visit only */ } },
};
const isVideoName = (n) => /\.(mp4|mov|m4v|webm)$/i.test(n);
const thumbName = (n) => n.replace(/\.[^.]+$/, ".jpg");

let lang = store.get(LANG_KEY) === "en" ? "en" : "th";
let token = "";
let items = [];          // {name, isNew, removed, pos, preview, full, thumb}
let busy = false;
let lastStatus = null;   // [key, kind, ...args] so a language switch re-says it

const t = (k, ...a) => (typeof TEXT[lang][k] === "function" ? TEXT[lang][k](...a) : TEXT[lang][k]);

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $("#lang").textContent = t("switchTo");
  if (lastStatus) setStatus(...lastStatus);
  if (items.length) render();
}
$("#lang").addEventListener("click", () => {
  lang = lang === "th" ? "en" : "th";
  store.set(LANG_KEY, lang);
  applyLang();
});

async function api(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    ...opts,
    headers: {
      Accept: "application/vnd.github+json",
      Authorization: `Bearer ${token}`,
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
    },
  });
  if (!r.ok) {
    const err = new Error(`GitHub ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

function setStatus(key, kind = "", ...args) {
  lastStatus = key ? [key, kind, ...args] : null;
  const s = $("#status");
  s.textContent = key ? t(key, ...args) : "";
  s.className = "status " + kind;
}

function isDirty() {
  return items.some((it, i) => it.isNew || it.removed || it.pos !== i);
}

function refreshBar() {
  const dirty = isDirty();
  $("#publish").disabled = busy || !dirty;
  if (!busy && dirty) setStatus("dirty");
}

function render() {
  let n = 0;
  $("#grid").innerHTML = items.map((it, i) => `
      <div class="tile${it.removed ? " removed" : ""}">
        <img src="${it.preview || `photos/thumb/${thumbName(it.name)}`}" alt="" loading="lazy">
        <span class="num">${it.removed ? "✕" : ++n}</span>
        ${it.isNew ? `<span class="new">${t("isNew")}</span>` : ""}
        ${isVideoName(it.name) ? '<span class="play">▶</span>' : ""}
        <div class="tools">
          <button type="button" data-act="left" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move earlier">◀</button>
          <button type="button" data-act="right" data-i="${i}" ${i === items.length - 1 ? "disabled" : ""} aria-label="Move later">▶</button>
          <button type="button" class="del" data-act="del" data-i="${i}" aria-label="Remove">${it.removed ? "↺" : "✕"}</button>
        </div>
      </div>`).join("");
  refreshBar();
}

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b || busy) return;
  const i = Number(b.dataset.i);
  if (b.dataset.act === "left" && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
  else if (b.dataset.act === "right" && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
  else if (b.dataset.act === "del") {
    // a new item that was never published just goes away
    if (items[i].isNew) items.splice(i, 1);
    else items[i].removed = !items[i].removed;
  }
  render();
});

/* ---------- prepare files on the phone: photos are shrunk (a 4 MB shot becomes ~250 KB),
              videos are kept as they are and get a still frame for the strip ---------- */
function toJpeg(src, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (src) g.drawImage(src, 0, 0, w, h);
  else {
    // no frame could be read from the video: a plain pink still with a play mark
    g.fillStyle = "#ff4fa3"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#fff"; g.beginPath();
    g.moveTo(w * .42, h * .4); g.lineTo(w * .42, h * .6); g.lineTo(w * .6, h * .5); g.fill();
  }
  return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.85));
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function loadVideoFrame(file) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    const give = (ok) => { clearTimeout(timer); resolve(ok ? v : null); };
    const timer = setTimeout(() => give(false), 12000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = () => give(v.videoWidth > 0);
    v.onerror = () => give(false);
    v.src = URL.createObjectURL(file);
    v.load();
  });
}
function uniqueBase(index) {
  return `${Date.now().toString(36)}-${index}`;
}
async function prepare(file, index) {
  const base = uniqueBase(index);
  if (file.type.startsWith("video/") || isVideoName(file.name)) {
    if (file.size > VIDEO_MAX_MB * 1024 * 1024) throw new Error("tooBig");
    const fromName = (file.name.match(/\.(mp4|mov|m4v|webm)$/i) || [])[1];
    const ext = (fromName || (file.type === "video/quicktime" ? "mov" : "mp4")).toLowerCase();
    const v = await loadVideoFrame(file);
    const W = v ? v.videoWidth : 4, H = v ? v.videoHeight : 5;
    const thumb = await toJpeg(v, THUMB_W, Math.round(H * THUMB_W / W));
    return { name: `${base}.${ext}`, isNew: true, removed: false, full: file, thumb, preview: URL.createObjectURL(thumb) };
  }
  const img = await loadImage(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  const k = Math.min(1, FULL_MAX / Math.max(W, H));
  const full = await toJpeg(img, Math.round(W * k), Math.round(H * k));
  const tw = Math.min(THUMB_W, W);
  const thumb = await toJpeg(img, tw, Math.round(H * tw / W));
  return { name: `${base}.jpg`, isNew: true, removed: false, full, thumb, preview: URL.createObjectURL(thumb) };
}

$("#files").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";
  if (!files.length) return;
  setStatus("preparing");
  const added = [];
  let problem = "";
  for (let i = 0; i < files.length; i++) {
    try { added.push(await prepare(files[i], i)); }
    catch (err) { problem = err.message === "tooBig" ? "tooBig" : "readFail"; }
  }
  // new work goes first so it is the first thing visitors see; ◀ ▶ can move it after
  items = [...added, ...items];
  render();
  if (problem) setStatus(problem, "err");
});

/* ---------- publish: one commit with new files, removed files and the new order ---------- */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
async function uploadBlob(blob) {
  const content = await blobToBase64(blob);
  const res = await api("git/blobs", { method: "POST", body: JSON.stringify({ content, encoding: "base64" }) });
  return res.sha;
}

$("#publish").addEventListener("click", async () => {
  if (busy || !isDirty()) return;
  busy = true;
  refreshBar();
  try {
    const tree = [];
    const file = (path, sha) => ({ path, mode: "100644", type: "blob", sha });
    const fresh = items.filter((it) => it.isNew && !it.removed);
    for (let i = 0; i < fresh.length; i++) {
      setStatus("uploading", "", i + 1, fresh.length);
      tree.push(file(`photos/${fresh[i].name}`, await uploadBlob(fresh[i].full)));
      tree.push(file(`photos/thumb/${thumbName(fresh[i].name)}`, await uploadBlob(fresh[i].thumb)));
    }
    for (const it of items.filter((x) => x.removed && !x.isNew)) {
      tree.push(file(`photos/${it.name}`, null));
      tree.push(file(`photos/thumb/${thumbName(it.name)}`, null));
    }
    // the site shows exactly this list, in this order
    const kept = items.filter((it) => !it.removed);
    tree.push({ path: LIST_PATH, mode: "100644", type: "blob",
                content: JSON.stringify(kept.map((it) => it.name), null, 1) + "\n" });

    setStatus("publishing");
    const ref = await api(`git/ref/heads/${BRANCH}`);
    const head = await api(`git/commits/${ref.object.sha}`);
    const newTree = await api("git/trees", { method: "POST", body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
    const commit = await api("git/commits", { method: "POST", body: JSON.stringify({
      message: "Update work photos (from admin page)", tree: newTree.sha, parents: [ref.object.sha] }) });
    await api(`git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) });

    items = kept.map((it, i) => ({ ...it, isNew: false, pos: i }));
    busy = false;
    render();
    setStatus("done", "ok");
  } catch (err) {
    busy = false;
    refreshBar();
    setStatus(err.status === 401 || err.status === 403 ? "keyRefused" : "publishFail", "err");
  }
});

/* ---------- start ---------- */
async function load() {
  // read through the API, not the site: the site can lag 1–2 min behind a publish
  const f = await api(`contents/${LIST_PATH}?ref=${BRANCH}`);
  const json = new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
  items = JSON.parse(json).map((name, i) => ({ name, isNew: false, removed: false, pos: i }));
  $("#login").classList.add("hidden");
  $("#editor").classList.remove("hidden");
  $("#bar").classList.remove("hidden");
  $("#logout").classList.remove("hidden");
  setStatus("");
  render();
}

async function connect(value) {
  token = value.trim();
  if (!token) return;
  $("#loginErr").textContent = "";
  try {
    await load();
    store.set(TOKEN_KEY, token);
  } catch (err) {
    store.set(TOKEN_KEY, "");
    $("#login").classList.remove("hidden");
    $("#loginErr").textContent = t([401, 403, 404].includes(err.status) ? "badKey" : "noNet");
  }
}

$("#connect").addEventListener("click", () => connect($("#token").value));
$("#token").addEventListener("keydown", (e) => { if (e.key === "Enter") connect($("#token").value); });
$("#logout").addEventListener("click", () => { store.set(TOKEN_KEY, ""); location.reload(); });
window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

// in Safari (not yet on the Home Screen), say how to install first: the Home Screen
// app keeps its own storage, so a key pasted in Safari would not follow it there
const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (/iPhone|iPad/.test(navigator.userAgent) && !standalone) $("#installHint").classList.remove("hidden");

applyLang();
const saved = store.get(TOKEN_KEY);
if (saved) connect(saved);
else $("#login").classList.remove("hidden");
</script>
</body>
</html>
